schema_version: 1
family: fiscaldata
entries:
- id: fiscaldata.dts_deposits_withdrawals
  family: fiscaldata
  title: DTS Table II deposits and withdrawals
  description: DTS Table II deposits and withdrawals
  publisher: U.S. Department of the Treasury, Bureau of the Fiscal Service
  aliases:
  - DTS Table II deposits and withdrawals
  tags:
  - treasury
  - cash
  verified_on: '2026-10-09'
  history:
    start: '2005-10-03'
  frequency: daily
  units:
    label: USD million
    scale: millions
    seasonal_adjustment: not seasonally adjusted
    annualized: false
    unit_class: usd_millions_nsa
  endpoint:
    url: https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/dts/deposits_withdrawals_operating_cash
    default_params:
      format: json
      sort: record_date,src_line_nbr
      page[size]: '100'
    allowed_params:
    - fields
    - filter
    - sort
    - page[size]
  access:
    executor: fiscaldata
    mode: machine
    auth:
      mode: none
  response:
    format: json
    data_path: data
    date_fields:
    - record_date
    value_fields:
    - transaction_today_amt
    pagination:
      kind: fiscaldata
      default_page_size: 100
      hard_max_pages: 100
    vintage_strategy: http_last_modified_or_retrieval
  refresh:
    cadence: daily
    notes: Published on Treasury business days.
  semantics:
    granularity: date and source row
    basis: DTS Table II deposits and withdrawals
    notes: 'Caller-owned fiscus overlay; same maintained FiscalData executor. Source
      definitions: https://fiscaldata.treasury.gov/datasets/daily-treasury-statement/
      and https://www.treasurydirect.gov/auctions/announcements-data-results/frn-daily/'
  tools:
  - fiscaldata_query
  caveats: []
