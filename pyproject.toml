[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tdc-estimator"
version = "0.2.0"
description = "Public-data measurement of Treasury-attributed deposit and reserve flows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "TDC Project Contributors" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "xlrd>=2.0.1",
]

[project.urls]
Repository = "https://github.com/smkwray/tdcest"
Issues = "https://github.com/smkwray/tdcest/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
tdc = "tdc_estimator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: needs real local inputs; run explicitly with -m integration and fails when they are absent"]
cache_dir = "~/venvs/tdcest/pytest-cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Script entry points add the checkout's src directory before package imports.
"scripts/*.py" = ["E402"]
